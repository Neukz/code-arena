openapi: 3.0.0
info:
  contact: {}
  description: REST API for the CodeArena coding challenge platform.
  title: CodeArena API
  version: 1.0.0
paths:
  /api/v1/languages:
    get:
      description: Returns all supported programming languages with their resource limits.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.ListLanguagesResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.ErrorResponse"
      summary: List supported languages
      tags:
        - languages
  /api/v1/problems:
    get:
      description: Returns all problems with id, slug, title, and difficulty.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.ListProblemsResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.ErrorResponse"
      summary: List problems
      tags:
        - problems
  "/api/v1/problems/{slug}":
    get:
      description: Returns problem details including the Markdown prompt and sample
        test cases.
      parameters:
        - description: Problem slug
          in: path
          name: slug
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.ProblemDetail"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.ErrorResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.ErrorResponse"
      summary: Get problem by slug
      tags:
        - problems
  /api/v1/submissions:
    post:
      description: Validates the request, persists a pending submission, and enqueues
        it for grading.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/api.CreateSubmissionRequest"
        description: Submission to grade
        required: true
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.CreateSubmissionResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.ErrorResponse"
        "503":
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.ErrorResponse"
      summary: Create a submission
      tags:
        - submissions
  "/api/v1/submissions/{id}":
    get:
      description: Returns submission status, overall verdict, error message, and
        per-test-case results. Hidden test cases omit stdout/stderr.
      parameters:
        - description: Submission ID
          in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.SubmissionStatusResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.ErrorResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.ErrorResponse"
      summary: Get submission status
      tags:
        - submissions
  /healthz:
    get:
      description: Returns ok if the service is running.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.HealthResponse"
      summary: Health check
      tags:
        - health
  /readyz:
    get:
      description: Returns ready when the database is reachable; otherwise unavailable.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.HealthResponse"
        "503":
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.HealthResponse"
      summary: Readiness check
      tags:
        - health
servers:
  - url: /
components:
  schemas:
    api.CreateSubmissionRequest:
      properties:
        language_id:
          type: string
        problem_id:
          type: string
        source_code:
          type: string
      required:
        - language_id
        - problem_id
        - source_code
      type: object
    api.CreateSubmissionResponse:
      properties:
        submission_id:
          type: string
      required:
        - submission_id
      type: object
    api.ErrorDetail:
      properties:
        code:
          type: string
        message:
          type: string
      required:
        - code
        - message
      type: object
    api.ErrorResponse:
      properties:
        error:
          $ref: "#/components/schemas/api.ErrorDetail"
      required:
        - error
      type: object
    api.HealthResponse:
      properties:
        status:
          type: string
      required:
        - status
      type: object
    api.Language:
      properties:
        display_name:
          type: string
        id:
          type: string
        memory_limit_mb:
          type: integer
        timeout_seconds:
          type: integer
      required:
        - display_name
        - id
        - memory_limit_mb
        - timeout_seconds
      type: object
    api.ListLanguagesResponse:
      properties:
        data:
          items:
            $ref: "#/components/schemas/api.Language"
          type: array
      required:
        - data
      type: object
    api.ListProblemsResponse:
      properties:
        data:
          items:
            $ref: "#/components/schemas/api.ProblemListItem"
          type: array
      required:
        - data
      type: object
    api.ProblemDetail:
      properties:
        created_at:
          type: string
        description:
          type: string
        difficulty:
          type: string
        id:
          type: string
        slug:
          type: string
        test_cases:
          items:
            $ref: "#/components/schemas/api.TestCase"
          type: array
        title:
          type: string
        updated_at:
          type: string
      required:
        - created_at
        - description
        - difficulty
        - id
        - slug
        - test_cases
        - title
        - updated_at
      type: object
    api.ProblemListItem:
      properties:
        created_at:
          type: string
        difficulty:
          type: string
        id:
          type: string
        slug:
          type: string
        title:
          type: string
      required:
        - created_at
        - difficulty
        - id
        - slug
        - title
      type: object
    api.SubmissionStatusResponse:
      properties:
        completed_at:
          type: string
        created_at:
          type: string
        error_message:
          type: string
        id:
          type: string
        language_id:
          type: string
        overall_verdict:
          type: string
        problem_id:
          type: string
        results:
          items:
            $ref: "#/components/schemas/api.SubmissionTestResult"
          type: array
        status:
          type: string
        updated_at:
          type: string
      required:
        - created_at
        - id
        - language_id
        - problem_id
        - results
        - status
        - updated_at
      type: object
    api.SubmissionTestResult:
      properties:
        execution_time_ms:
          type: integer
        memory_used_mb:
          type: integer
        name:
          type: string
        stderr:
          type: string
        stdout:
          type: string
        test_case_id:
          type: string
        verdict:
          type: string
      required:
        - name
        - test_case_id
        - verdict
      type: object
    api.TestCase:
      properties:
        expected_output:
          type: string
        id:
          type: string
        input:
          type: string
        name:
          type: string
      required:
        - expected_output
        - id
        - input
        - name
      type: object
