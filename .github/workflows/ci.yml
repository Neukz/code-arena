name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    name: Go - build, lint, test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: go build ./...
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
      - name: Build executor images
        run: |
          docker build -t codearena/executor-python:latest ./executor-images/python
          docker build -t codearena/executor-javascript:latest ./executor-images/javascript
          docker build -t codearena/executor-go:latest ./executor-images/go
      - name: Cache goose
        id: cache-goose
        uses: actions/cache@v6
        with:
          path: ~/go/bin/goose
          key: ${{ runner.os }}-goose-v3.28.0
      - name: Install goose
        if: steps.cache-goose.outputs.cache-hit != 'true'
        run: go install github.com/pressly/goose/v3/cmd/goose@v3.28.0
      - name: Test
        run: go test ./...

  docker-compose:
    name: Docker Compose - validate config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate docker-compose.yml
        run: docker compose config
