# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

dotenv:
  - .env

vars:
  GOOSE_MIGRATION_DIR: ./sql/schema

includes:
  go:
    taskfile: ./cmd/Taskfile.yml
  web:
    taskfile: ./apps/web/Taskfile.yml
    dir: ./apps/web

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list-all
    silent: true

  dev:
    desc: Start the full local development stack
    cmds:
      - docker compose up --build

  build:
    desc: Build all services
    deps: [go:build, web:build]

  test:
    desc: Run all tests
    deps: [go:test]
    # web:test will be added once frontend tests are wired (Task 20).

  lint:
    desc: Lint all code
    deps: [go:lint, web:lint]

  typecheck:
    desc: Typecheck the frontend code
    deps: [web:typecheck]

  compose:config:
    desc: Validate docker-compose.yml
    cmds:
      - docker compose config

  ci:
    desc: Run the local CI gate (mirrors .github/workflows/ci.yml)
    cmds:
      - task go:build
      - task go:lint
      - task go:test
      - task web:typecheck
      - task web:lint
      - task web:build
      - task compose:config

  migrate-up:
    desc: Run database migrations
    cmds:
      - goose -dir {{.GOOSE_MIGRATION_DIR}} postgres "$DATABASE_URL" up

  migrate-down:
    desc: Roll back database migrations
    cmds:
      - goose -dir {{.GOOSE_MIGRATION_DIR}} postgres "$DATABASE_URL" down

  sqlc-generate:
    desc: Generate Go code from sqlc queries
    cmds:
      - sqlc generate
